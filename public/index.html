<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cartas Contra a Galera</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><rect x='7' y='6' width='14' height='20' rx='2' fill='%23fff'/><rect x='12' y='9' width='14' height='20' rx='2' fill='%23fff' stroke='%23000' stroke-width='2'/></svg>" />
</head>
<body>

<!-- ===================== TELA DE ENTRADA ===================== -->
<section id="tela-entrada" class="tela ativa">
  <div class="entrada-caixa">
    <div class="topo-entrada">
      <div class="logo">
        <span class="logo-carta preta">Cartas contra</span>
        <span class="logo-carta branca">a galera</span>
      </div>
      <div class="troca-idioma" id="idioma-entrada">
        <button class="botao-idioma" data-idioma="pt">PT</button>
        <button class="botao-idioma" data-idioma="en">EN</button>
      </div>
    </div>
    <p class="subtitulo" data-t="entrada.subtitulo"></p>

    <label class="campo">
      <span data-t="entrada.apelido"></span>
      <input id="in-nome" maxlength="16" data-tph="entrada.apelidoDica" autocomplete="off" />
    </label>

    <button id="btn-criar" class="botao principal grande" data-t="entrada.criar"></button>
    <p class="rodape-dica so-no-app" data-t="entrada.criarNota"></p>

    <div class="ou"><span data-t="entrada.ou"></span></div>

    <!-- so aparece dentro do app: o endereco de quem esta hospedando -->
    <label class="campo so-no-app">
      <span data-t="entrada.endereco"></span>
      <input id="in-endereco" placeholder="192.168.0.10:3000" autocomplete="off" />
    </label>

    <div class="linha">
      <input id="in-codigo" maxlength="4" data-tph="entrada.codigo" class="codigo-input" autocomplete="off" />
      <button id="btn-entrar" class="botao" data-t="entrada.entrar"></button>
    </div>

    <p id="erro-entrada" class="erro"></p>
    <p class="rodape-dica so-no-navegador" data-t="entrada.dica"></p>

    <p class="creditos" data-thtml="entrada.creditos"></p>
  </div>
</section>

<!-- ===================== TELA DO JOGO ===================== -->
<section id="tela-jogo" class="tela">

  <header class="topo">
    <button id="btn-codigo" class="chip">
      <span data-t="topo.sala"></span> <b id="lbl-codigo">----</b>
    </button>
    <div class="chip" id="lbl-rodada"></div>
    <div class="chip cronometro" id="lbl-tempo" hidden><b>--</b></div>
    <div class="espaco"></div>
    <button id="btn-painel" class="chip so-mobile" data-t="topo.jogadores"></button>
    <button id="btn-sair" class="chip" data-t="topo.sair"></button>
  </header>

  <div class="corpo">

    <!-- ---------- coluna lateral: jogadores + feed ---------- -->
    <aside id="painel" class="painel">
      <h3 data-t="painel.jogadores"></h3>
      <ul id="lista-jogadores" class="jogadores"></ul>

      <h3 data-t="painel.feed"></h3>
      <div id="feed" class="feed"></div>
    </aside>

    <!-- ---------- area principal ---------- -->
    <main class="mesa-area">

      <!-- LOBBY -->
      <div id="area-lobby" class="area">
        <h2 data-t="lobby.titulo"></h2>
        <p class="explica" id="lbl-explica-lobby"></p>
        <button id="btn-convite" class="botao" data-t="lobby.copiar"></button>

        <div id="enderecos-host" class="config" hidden></div>

        <div id="config-dono" class="config" hidden>
          <h3 data-t="lobby.config"></h3>

          <label class="campo linha-campo">
            <span data-t="lobby.idioma"></span>
            <div class="troca-idioma" id="idioma-sala">
              <button class="botao-idioma" data-idioma="pt">PT</button>
              <button class="botao-idioma" data-idioma="en">EN</button>
            </div>
          </label>
          <p class="nota-campo" data-t="lobby.idiomaNota"></p>

          <label class="campo linha-campo">
            <span data-t="lobby.rodadas"></span>
            <input id="in-rodadas" type="number" min="0" max="200" value="20" />
          </label>
          <p class="nota-campo" data-t="lobby.rodadasNota"></p>

          <label class="campo linha-campo">
            <span data-t="lobby.tempo"></span>
            <input id="in-tempo" type="number" min="0" max="300" step="5" value="90" />
          </label>
          <p class="nota-campo" data-t="lobby.tempoNota"></p>
        </div>

        <div id="config-visita" class="config leve">
          <p id="lbl-resumo-config"></p>
        </div>

        <button id="btn-comecar" class="botao principal grande" disabled data-t="lobby.comecar"></button>
        <p id="aviso-lobby" class="explica"></p>
      </div>

      <!-- JOGO -->
      <div id="area-jogo" class="area" hidden>
        <div class="tabuleiro">
          <div id="carta-preta" class="carta preta grande"></div>
          <div class="instrucao" id="instrucao"></div>
        </div>

        <div id="mesa" class="mesa"></div>

        <div id="acoes" class="acoes"></div>

        <div id="area-mao">
          <div class="titulo-mao">
            <h3 data-t="jogo.suaMao"></h3>
            <span id="contador-selecao" class="dica-selecao"></span>
          </div>
          <div id="mao" class="mao"></div>
        </div>
      </div>

      <!-- FIM -->
      <div id="area-fim" class="area" hidden>
        <h2 data-t="fim.titulo"></h2>
        <p class="explica" id="lbl-fim-explica"></p>
        <button id="btn-reiniciar" class="botao principal" data-t="fim.denovo"></button>
      </div>

    </main>
  </div>
</section>

<div id="aviso" class="aviso"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="idiomas.js"></script>
<script src="client.js"></script>
</body>
</html>
